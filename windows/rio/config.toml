# Rio 终端配置 — 对齐 Windows Terminal 观感
# (Gruvbox Dark / Maple Mono NF CN / 81% 透明 + Acrylic / Arch WSL 默认 shell)
# 部署: 复制到 %USERPROFILE%\AppData\Local\rio\config.toml
# 主题本体在同目录 themes/gruvbox-dark.toml (Rio 支持配置热重载)
theme = "gruvbox-dark"
confirm-before-quit = false
copy-on-select = true
scrollback-history-limit = 20000
padding = [0]

[fonts]
family = "Maple Mono NF CN"
size = 15

[window]
opacity = 0.81
blur = true

[cursor]
shape = 'block'

[shell]
program = "wsl.exe"
args = ["-d", "Arch", "--user", "zllynx", "--cd", "~"]
