# AeroSpace 配置 — zhenli
# 快捷键前缀 M = ctrl+alt（Karabiner 把右 Cmd 映射为 ctrl+alt，左手零占用）
#
# ── 速查 ─────────────────────────────────────────────────────────
#  M+w/a/s/d        焦点 上/左/下/右          M+Enter          打开 Ghostty
#  M+shift+w/a/s/d  移动窗口                  M+1..9           看 workspace N
#  M+shift+1..9     丢窗口到 workspace N      M+tab            回上一个 workspace
#  M+q / M+z        焦点切上屏/下屏 (Q左上=外接 Z左下=MBP)  M+shift+tab   workspace 挪到另一屏
#  M+shift+q / M+shift+z  窗口扔到另一屏并跟过去     M+f              放大/还原
#  M+minus/equal    缩小/放大                 M+shift+space    浮动 ⇄ 平铺
#  M+slash          横竖布局轮换              M+comma          accordion 轮换
#  M+space          service 模式（esc 退出并重载配置）
# ────────────────────────────────────────────────────────────────
config-version = 2

after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=7.0'
]

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true  # ⌘+H 藏起来的 app，切到它的工作区自动唤起

# 空 workspace 常驻：数字随时可按，不必先有窗口
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     0
outer.top =        0
outer.right =      10

# 双屏固定分区：外接(RV200plus) = 工作：1 终端+ChatGPT、2 浏览器、3 编辑器、4 其他 AI、5 数据
#               内屏(built-in) = 私人：6 IM/微信、7 笔记、8 音乐、9 杂项
# 拔掉外接单屏使用时，外接工作区自动回落到唯一屏幕
[workspace-to-monitor-force-assignment]
'1' = 'RV200plus'
'2' = 'RV200plus'
'3' = 'RV200plus'
'4' = 'RV200plus'
'5' = 'RV200plus'
'6' = 'built-in'
'7' = 'built-in'
'8' = 'built-in'
'9' = 'built-in'

[mode.main.binding]
ctrl-alt-enter = 'exec-and-forget open -a Ghostty'

# 焦点与移动（wasd 方位：w 上 a 左 s 下 d 右）
ctrl-alt-w = 'focus up'
ctrl-alt-a = 'focus left'
ctrl-alt-s = 'focus down'
ctrl-alt-d = 'focus right'
ctrl-alt-shift-w = 'move up'
ctrl-alt-shift-a = 'move left'
ctrl-alt-shift-s = 'move down'
ctrl-alt-shift-d = 'move right'

# 缩放
ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'

# 看 workspace / 丢窗口
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'
ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-shift-9 = 'move-node-to-workspace 9'

ctrl-alt-tab = 'workspace-back-and-forth'
ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# 双屏上下布局：外接在上，MacBook 在下；Q=字母区左上=上屏，Z=左下=下屏
ctrl-alt-q = 'focus-monitor up'
ctrl-alt-z = 'focus-monitor down'
ctrl-alt-shift-q = 'move-node-to-monitor up --focus-follows-window'      # 丢上去并跟过去
ctrl-alt-shift-z = 'move-node-to-monitor down --focus-follows-window'    # 丢下去并跟过去

ctrl-alt-f = 'layout accordion tiles'  # 放大⇄还原当前窗口（占满工作区，不创建新桌面）
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'
ctrl-alt-shift-space = 'layout floating tiling'
ctrl-alt-space = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
ctrl-alt-shift-w = ['join-with up', 'mode main']
ctrl-alt-shift-a = ['join-with left', 'mode main']
ctrl-alt-shift-s = ['join-with down', 'mode main']
ctrl-alt-shift-d = ['join-with right', 'mode main']

# ── 窗口自动归类（按 bundle id 精确匹配）──
# 截图工具悬浮，不参与平铺；check-further-callbacks 让后续归类规则继续跑
[[on-window-detected]]
if = 'test %{app-bundle-id} = pl.maketheweb.cleanshotx || test %{app-bundle-id} = com.Snipaste'
check-further-callbacks = true
run = ['layout floating']

# 1 终端+ChatGPT（外接主力区）
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty || test %{app-bundle-id} = com.openai.chat'
run = ['move-node-to-workspace 1']

# 2 浏览器
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome || test %{app-bundle-id} = com.microsoft.edgemac'
run = ['move-node-to-workspace 2']

# 3 编辑器
[[on-window-detected]]
if = 'test %{app-bundle-id} = dev.zed.Zed || test %{app-bundle-id} = com.microsoft.VSCode'
run = ['move-node-to-workspace 3']

# 4 其他 AI（Codex + 豆包 + 腾讯 ima）
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.openai.codex || test %{app-bundle-id} = com.bot.pc.doubao || test %{app-bundle-id} = com.tencent.imamac'
run = ['move-node-to-workspace 4']

# 5 数据 / 本地服务
[[on-window-detected]]
if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product || test %{app-bundle-id} = com.tinyapp.TablePlus || test %{app-bundle-id} = dev.kdrag0n.MacVirt || test %{app-bundle-id} = Dev.ServBay.macOS.ServBay'
run = ['move-node-to-workspace 5']

# 微信：浮动面板（不平铺）；check-further-callbacks 让下方 IM 规则继续把它送去 6 号
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tencent.xinWeChat'
check-further-callbacks = true
run = ['layout floating']

# 6 IM / 会议
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tencent.xinWeChat || test %{app-bundle-id} = com.tencent.qq || test %{app-bundle-id} = ru.keepcoder.Telegram || test %{app-bundle-id} = com.tencent.meeting'
run = ['move-node-to-workspace 6']

# 7 笔记 / 任务
[[on-window-detected]]
if = 'test %{app-bundle-id} = md.obsidian || test %{app-bundle-id} = com.flomoapp.m || test %{app-bundle-id} = com.TickTick.task.mac || test %{app-bundle-id} = com.linnk.Linnk || test %{app-bundle-id} = abnerworks.Typora'
run = ['move-node-to-workspace 7']

# 8 音乐
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.netease.163music'
run = ['move-node-to-workspace 8']

# 9 杂项（文件管理器兜底）
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.jinghaoshe.qspace.pro'
run = ['move-node-to-workspace 9']
