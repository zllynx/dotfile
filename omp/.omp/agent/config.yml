providers:
  webSearchOrder:
    - zai
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: dark-gruvbox
setupVersion: 2
modelRoles:
  smol: zai/glm-5.2:medium
  default: alibaba-token-plan/qwen3.8-flash
defaultThinkingLevel: auto
composer:
  shape: box
statusLine:
  separator: ascii
  transparent: false
  contextLine: annotated
  sessionAccent: true
  compactThinkingLevel: false
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
    - cache_hit
terminal:
  showProgress: true
tui:
  textSizing: true
  tight: true
  imeSafeCursor: true
  reactions: true
display:
  shimmer: kitt
  hideToolActivity: false
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
task:
  showResolvedModelBadge: true
retry:
  fallbackChains:
    zai/*:
      - alibaba-token-plan/qwen3.8-flash
      - siliconflow/zai-org/GLM-5.3
      - deepseek/deepseek-v4-flash
    alibaba-token-plan/*:
      - zai/glm-5.3-flash
      - siliconflow/zai-org/GLM-5.3
      - deepseek/deepseek-v4-flash
    siliconflow/*:
      - zai/glm-5.3-flash
      - deepseek/deepseek-v4-flash
    deepseek/*:
      - zai/glm-5.3-flash
    default:
      - siliconflow/deepseek-ai/DeepSeek-V4-Flash
      - deepseek/deepseek-v4-flash