# Nord 主题状态栏 (truecolor hex, 不依赖主题插件与终端 16 色调色板, 跨机器一致)
# palette: nord0=#2E3440 nord1=#3B4252 nord4=#D8DEE9 nord8=#88C0D0 nord10=#5E81AC
set -g status-style "bg=#3B4252,fg=#D8DEE9"
set -g status-left "#[fg=#2E3440,bg=#5E81AC,bold] #S #[fg=#5E81AC,bg=default,nobold,noitalics,nounderscore]"
set -g window-status-format "#[fg=#2E3440,bg=default,nobold,noitalics,nounderscore] #[fg=#D8DEE9,bg=default]#I #[fg=#D8DEE9,bg=default,nobold,noitalics,nounderscore] #[fg=#D8DEE9,bg=default]#W #F #[fg=#2E3440,bg=default,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore] #[fg=#2E3440,bg=#88C0D0]#I #[fg=#2E3440,bg=#88C0D0,nobold,noitalics,nounderscore] #[fg=#2E3440,bg=#88C0D0]#W #F #[fg=#88C0D0,bg=default,nobold,noitalics,nounderscore]"
set -g window-status-separator ""

# Clear right status bar
set -g status-right ""
set -g status-right-length 0

# Synchronize panes toggle: C-s C-s (double-press prefix, identical on PC/Mac)
bind C-s set -w synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"
