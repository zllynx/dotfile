# Migrated from tmux (dotfile/tmux/.tmux.conf + .tmux_local.conf), 2026-09-08
# Full reference: herdr --default-config ; validate: herdr config check
onboarding = false

[theme]
# .tmux_local.conf: 手写 Nord truecolor 状态栏配色 → 内置 nord 主题
name = "gruvbox"

auto_switch = false
[terminal]
# set-option -g default-shell /bin/zsh
default_shell = "/bin/zsh"

[ui]
# set-option -g status-position bottom
tab_bar_position = "bottom"
# pane-border-status top + pane-border-format " #P #T " 的最接近替代:
# 在分屏边框显示检测到的 agent 标签 (不支持自定义 pane 标题格式)
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[keys]
# set -g prefix C-s (act like GNU screen)
# bind | split-window -h (左右分屏)
split_vertical = "prefix+|"
# tmux prefix+s choose-tree 习惯 → goto 列 tab/pane; prefix+g 保留双绑
goto = ["prefix+s", "prefix+g"]
# herdr 默认 prefix+s = settings, 让位后挪到 shift 位
settings = "prefix+shift+s"
# bind - split-window -v (上下分屏) = 默认值 prefix+minus, 无需覆盖
# bind h/j/k/l select-pane = 默认值 prefix+h/j/k/l, 无需覆盖
# bind c new-window -c "#{pane_current_path}" = 默认 new_cwd = "follow"
# bind x kill-pane = 默认值 close_pane prefix+x
# bind ' last-pane
last_pane = "prefix+'"
# bind < / > swap-window -d -t ±1 → 前移/后移 tab
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"
# bind Q confirm kill-window → 关闭 tab (覆盖默认 prefix+shift+x)
close_tab = "prefix+shift+q"
# bind . select-pane -T (重命名 pane 标题)
rename_pane = "prefix+."
# bind -r J/K/H/L resize-pane ±5 (herdr 无步长设置, 每按一次一格;
# 会覆盖默认的 prefix+shift+h/j/k/l swap-pane)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
# bind C-r source-file ~/.tmux.conf (bind r 让给了 resize mode)
reload_config = "prefix+ctrl+r"
# tmux 默认 prefix d detach; 保留 herdr 默认 prefix+q
detach = ["prefix+d", "prefix+q"]
# prefix+w navigate 选择模式: workspace 行用 j/k, pane 方向默认已是 h/j/k/l
# (navigate_* 仅接受普通键, 禁止 prefix+/esc/enter/tab/数字)
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[ui.toast]
# 桌面通知已全量中文接管: 完成=omp-done, blocked=omp-herdr-watch (launchd)。
# herdr 桌面横幅(英文, osa/OSC)退到应用内 toast, 声音照常。
# 回滚: 改回 "terminal" 即恢复 Ghostty 图标英文横幅。
delivery = "herdr"
